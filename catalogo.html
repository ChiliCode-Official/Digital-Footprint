<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Virtual - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            color: var(--text-main);
            border-color: var(--accent-primary);
        }
    </style>
</head>
<body>

    <div class="dashboard-container no-right-panel">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="brand-logo">GKey</a>
            <ul class="nav-links">
                <div class="nav-indicator" style="top: 75px;"></div>
                <li class="nav-item">
                    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i></a>
                </li>
                <li class="nav-item active">
                    <a href="catalogo.html" class="nav-link"><i class="fa-solid fa-gamepad"></i></a>
                </li>
                <li class="nav-item">
                    <a href="perfil.html" class="nav-link"><i class="fa-solid fa-user"></i></a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="grid-column: 2 / span 2;">
            <header class="top-bar">
                <!-- From Uiverse.io by Lakshay-art --> 
                <div id="poda">
                  <div class="glow"></div>
                  <div class="darkBorderBg"></div>
                  <div class="darkBorderBg"></div>
                  <div class="darkBorderBg"></div>

                  <div class="white"></div>

                  <div class="border"></div>

                  <div id="main">
                    <input id="search-input" placeholder="Buscar productos..." type="text" name="text" class="input" />
                    <div id="input-mask"></div>
                    <div id="pink-mask"></div>
                    <div class="filterBorder"></div>
                    <div id="filter-icon">
                      <svg
                        preserveAspectRatio="none"
                        height="27"
                        width="27"
                        viewBox="4.8 4.56 14.832 15.408"
                        fill="none"
                      >
                        <path
                          d="M8.16 6.65002H15.83C16.47 6.65002 16.99 7.17002 16.99 7.81002V9.09002C16.99 9.56002 16.7 10.14 16.41 10.43L13.91 12.64C13.56 12.93 13.33 13.51 13.33 13.98V16.48C13.33 16.83 13.1 17.29 12.81 17.47L12 17.98C11.24 18.45 10.2 17.92 10.2 16.99V13.91C10.2 13.5 9.97 12.98 9.73 12.69L7.52 10.36C7.23 10.08 7 9.55002 7 9.20002V7.87002C7 7.17002 7.52 6.65002 8.16 6.65002Z"
                          stroke="#d6d6e6"
                          stroke-width="1"
                          stroke-miterlimit="10"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        ></path>
                      </svg>
                    </div>
                    <div id="search-icon">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        height="24"
                        fill="none"
                        class="feather feather-search"
                      >
                        <circle stroke="url(#search)" r="8" cy="11" cx="11"></circle>
                        <line
                          stroke="url(#searchl)"
                          y2="16.65"
                          y1="22"
                          x2="16.65"
                          x1="22"
                        ></line>
                        <defs>
                          <linearGradient gradientTransform="rotate(50)" id="search">
                            <stop stop-color="#f8e7f8" offset="0%"></stop>
                            <stop stop-color="#b6a9b7" offset="50%"></stop>
                          </linearGradient>
                          <linearGradient id="searchl">
                            <stop stop-color="#b6a9b7" offset="0%"></stop>
                            <stop stop-color="#837484" offset="50%"></stop>
                          </linearGradient>
                        </defs>
                      </svg>
                    </div>
                  </div>
                </div>
                <div class="top-actions">
                    <a href="perfil.html" class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=User&background=A182E8&color=fff" alt="User" class="user-avatar">
                    </a>
                </div>
            </header>

            <section style="margin-top: 1rem;">
                <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem;">Catálogo</h1>
                
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="juegos">Juegos</button>
                    <button class="filter-btn" data-filter="cuentas">Cuentas</button>
                    <button class="filter-btn" data-filter="saldo">Saldo Virtual</button>
                </div>

                <div class="catalog-grid" id="catalog-grid">
                    <!-- Products injected by JS -->
                </div>
            </section>
        </main>
    </div>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
        <div class="mobile-menu__backdrop" id="mobile-menu-backdrop"></div>
        <div class="mobile-menu__panel">
            <p class="mobile-menu__title">Más opciones</p>
            <a href="index.html" class="mobile-menu__link"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="catalogo.html" class="mobile-menu__link"><i class="fa-solid fa-gamepad"></i> Catálogo</a>
            <a href="perfil.html" class="mobile-menu__link"><i class="fa-solid fa-user"></i> Perfil</a>
            <a href="info.html" class="mobile-menu__link"><i class="fa-solid fa-circle-info"></i> Información</a>
        </div>
    </div>

    <!-- Mobile Dock -->
    <nav class="mobile-dock">
        <a href="index.html" class="dock-item"><i class="fa-solid fa-house"></i></a>
        <a href="catalogo.html" class="dock-item active"><i class="fa-solid fa-gamepad"></i></a>
        <label class="hamburger dock-item" style="margin: 0; padding: 0;">
          <input type="checkbox" id="mobile-menu-toggle-cat">
          <svg viewBox="0 0 32 32">
            <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
            <path class="line" d="M7 16 27 16"></path>
          </svg>
        </label>
        <a href="#" class="dock-item"><i class="fa-solid fa-users"></i></a>
        <a href="perfil.html" class="dock-item"><i class="fa-solid fa-user"></i></a>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="js/catalogo.js"></script>
    <script type="module" src="js/mobile-nav.js"></script>
    <script type="module" src="js/cart.js"></script>
</body>
</html>
