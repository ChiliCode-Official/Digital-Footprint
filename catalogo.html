<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Virtual - Catálogo</title>

    <meta name="description" content="Compra cuentas premium, claves de juegos y saldo virtual en GhostKey. Entrega rápida, transacciones seguras y soporte dedicado.">
    <meta name="keywords" content="cuentas premium, claves juegos, saldo virtual, GhostKey, tienda digital, videojuegos">
    <meta name="author" content="GhostKey Oficial">
    <meta property="og:title" content="GhostKey - Tienda Digital Premium">
    <meta property="og:description" content="Compra cuentas premium, claves de juegos y saldo virtual.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ghostkey.online/">
    <meta property="og:image" content="https://i.imgur.com/LbMnNUg.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            color: var(--text-main);
            border-color: var(--accent-primary);
        }
    </style>
<link rel="icon" type="image/png" href="https://i.imgur.com/Wq4wBb7.png"></head>
<body>
    <!-- ===== GLOBAL NAVBAR (GhostKey) ===== -->
    <style>
        html, body { height: auto !important; overflow: visible !important; overflow-x: hidden !important; }
        body { display: block !important; min-height: 100vh; }
        .gk-navbar { position: sticky; top: 0; z-index: 1000; background: var(--bg-card); border-bottom: 2px solid var(--accent-primary); display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 60px; box-shadow: 0 2px 16px rgba(0,0,0,0.4); }
        .gk-nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
        .gk-nav-logo img { width: 36px; height: 36px; border-radius: 8px; }
        .gk-nav-logo span { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .gk-search-wrap { flex: 1; display: flex; align-items: center; background: var(--bg-main); border: 2px solid var(--glass-border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s; max-width: 700px; }
        .gk-search-wrap:focus-within { border-color: var(--accent-primary); }
        .gk-search-wrap input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); padding: 8px 12px; font-size: 0.95rem; font-family: inherit; }
        .gk-search-wrap input::placeholder { color: var(--text-muted); }
        .gk-search-btn-nav { background: var(--accent-primary); border: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; color: #fff; font-size: 1rem; }
        .gk-search-btn-nav:hover { background: var(--accent-secondary, #7c5cbf); }
        .gk-nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .gk-nav-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; font-family: inherit; text-decoration: none; transition: background 0.2s; white-space: nowrap; }
        .gk-nav-btn:hover { background: var(--bg-main); }
        .gk-nav-btn .lbl { display: none; }
        @media(min-width:768px) { .gk-nav-btn .lbl { display: inline; } }
        .gk-nav-balance { background: rgba(161,120,232,0.12); border: 1px solid var(--accent-primary); color: var(--accent-primary); font-weight: 700; }
        .gk-user-chip { display: flex; align-items: center; gap: 8px; background: var(--bg-main); border: 1px solid var(--glass-border); border-radius: 30px; padding: 4px 12px 4px 4px; cursor: pointer; transition: border-color 0.2s; text-decoration: none; }
        .gk-user-chip:hover { border-color: var(--accent-primary); }
        .gk-user-chip img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .gk-user-chip span { font-size: 0.85rem; color: var(--text-main); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
        @media(min-width:600px) { .gk-user-chip span { display: inline; } }
        .gk-page-body { max-width: 1400px; margin: 0 auto; padding: 0 16px 100px; }
        .gk-dock { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--glass-border); display: none; align-items: center; justify-content: space-around; padding: 8px 0; z-index: 1001; }
        @media(max-width: 768px) { .gk-dock { display: flex; } .gk-page-body { padding-bottom: 80px; } }
        .gk-dock-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; padding: 4px 12px; border-radius: 8px; transition: color 0.2s; border: none; background: transparent; cursor: pointer; font-family: inherit; }
        .gk-dock-item i { font-size: 1.2rem; }
        .gk-dock-item.active { color: var(--accent-primary); }
    </style>
    <nav class="gk-navbar">
        <a href="index.html" class="gk-nav-logo"><img src="https://i.imgur.com/Wq4wBb7.png" alt="GhostKey"><span>GhostKey</span></a>
        <div class="gk-search-wrap">
            <input id="gk-nav-search" type="text" placeholder="Buscar productos..." autocomplete="off">
            <button class="gk-search-btn-nav" id="gk-nav-search-btn" title="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="gk-nav-actions">
            <a href="pago.html" class="gk-nav-btn gk-nav-balance" id="nav-balance-btn" title="Mi saldo">
                <i class="fa-solid fa-wallet"></i>
                <span class="label" id="nav-balance-label">Saldo</span>
            </a>
            <button class="gk-nav-btn" id="nav-friends-btn" title="Amigos">
                <i class="fa-solid fa-users"></i>
                <span class="label">Amigos</span>
            </button>
            <a href="cart.html" class="gk-nav-btn" title="Carrito">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="label">Carrito</span>
            </a>
            <div class="gk-user-chip" id="user-profile-btn" title="Mi perfil" onclick="window.location='perfil.html'">
                <img id="user-avatar" class="user-avatar" src="https://ui-avatars.com/api/?name=G&background=A182E8&color=fff" alt="Avatar" referrerpolicy="no-referrer">
                <span id="user-name">Cuenta</span>
            </div>
        </div>
    </nav>
    <script>
        // Search redirect
        (function(){
            var btn = document.getElementById('gk-nav-search-btn');
            var inp = document.getElementById('gk-nav-search');
            if(btn && inp){
                btn.addEventListener('click', function(){ var q=inp.value.trim(); if(q) window.location.href='catalogo.html?search='+encodeURIComponent(q); });
                inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var q=inp.value.trim(); if(q) window.location.href='catalogo.html?search='+encodeURIComponent(q); } });
            }
        })();
    </script>
    
    <style>
        .catalog-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }
        .catalog-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            position: sticky;
            top: 80px;
        }
        .catalog-main {
            flex: 1;
        }
        @media(max-width: 768px) {
            .catalog-layout {
                flex-direction: column;
            }
            .catalog-sidebar {
                width: 100%;
                position: static;
            }
        }
    </style>
    <div class="gk-page-body" style="padding-top: 2rem;">
        <div class="catalog-layout">
            <aside class="catalog-sidebar">
                <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; color: var(--text-main);">Filtros</h2>
                
                <div style="margin-bottom: 1.5rem;">
                    <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase;">Precio</h3>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
                            <input type="radio" name="price-filter" value="all" checked> Todos
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
                            <input type="radio" name="price-filter" value="under-100"> Menos de $100
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
                            <input type="radio" name="price-filter" value="100-500"> $100 a $500
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
                            <input type="radio" name="price-filter" value="over-500"> Más de $500
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase;">Ordenar</h3>
                    <select id="sort-select" style="width: 100%; background: var(--bg-main); border: 1px solid var(--glass-border); padding: 8px; border-radius: 8px; color: var(--text-main); font-family: inherit;">
                        <option value="default">Relevancia</option>
                        <option value="price-asc">Precio: de menor a mayor</option>
                        <option value="price-desc">Precio: de mayor a menor</option>
                        <option value="newest">Lo más nuevo</option>
                    </select>
                </div>
            </aside>
            
            <main class="catalog-main">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h1 style="font-size: 2.2rem; font-weight: 800; margin: 0;">Catálogo</h1>
                    <span id="results-count" style="color: var(--text-muted); font-size: 0.9rem;">Cargando...</span>
                </div>
                
                <div class="catalog-grid" id="catalog-grid">

                    <!-- Products injected by JS -->
                </div>
            </main>
        </div>
    </div>

    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/catalogo.js"></script>
    <script type="module" src="js/mobile-nav.js"></script>
    <script type="module" src="js/cart.js"></script>
    <!-- ===== MOBILE BOTTOM DOCK ===== -->
    <nav class="gk-dock">
        <a href="index.html" class="gk-dock-item">
            <i class="fa-solid fa-house"></i>
            <span>Inicióo</span>
        </a>
        <a href="catalogo.html" class="gk-dock-item active">
            <i class="fa-solid fa-gamepad"></i>
            <span>Catálogo</span>
        </a>
        <button class="gk-dock-item" id="dock-friends-btn">
            <i class="fa-solid fa-users"></i>
            <span>Amigos</span>
        </button>
        <a href="pago.html" class="gk-dock-item">
            <i class="fa-solid fa-wallet"></i>
            <span>Saldo</span>
        </a>
        <a href="perfil.html" class="gk-dock-item">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
        </a>
    </nav>
<!-- ===== FRIENDS SIDE PANEL ===== -->
    <div class="gk-friends-panel-backdrop" id="friends-backdrop"></div>
    <aside class="gk-friends-panel" id="friends-panel">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <h3 style="margin:0; font-size:1.05rem; font-weight:800; color:var(--text-main); display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-users" style="color:var(--accent-primary);"></i> Amigos & Referidos
            </h3>
            <button id="close-friends-panel" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:1.2rem;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Search -->
        <div class="brutalist-container" style="width: 100%; margin-top: 4px;">
            <input id="search-friend-input" placeholder="Correo o UID de amigo..." class="brutalist-input smooth-type" type="text" style="padding: 10px; font-size: 14px; border-width: 2px;" />
            <label class="brutalist-label" style="top: -20px; font-size: 10px;">BUSCAR / AÑADIR</label>
        </div>
        <button type="button" class="btn-primary" id="search-friend-btn" style="width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-user-plus"></i> Buscar Amigo
        </button>

        <!-- Friends List -->
        <div style="flex:1;">
            <h4 style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.8rem;">
                Miembros de la Comunidad
            </h4>
            <div class="friends-list" id="friends-list" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Cargando... amigos...</p>
            </div>
        </div>

        <!-- Referral -->
        <div class="referral-box" style="background: var(--bg-card); border: 1px solid var(--glass-border); padding: 1rem; border-radius: var(--border-radius-md, 12px);">
            <h4 style="font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--accent-primary);">
                <i class="fa-solid fa-gift"></i> Tu Enlace de Invitación
            </h4>
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4;">
                ¡Gana 3% en saldo cuando tus amigos compren usando tu link!
            </p>
            <div style="display:flex; gap: 6px;">
                <input type="text" id="ref-link-input" readonly value="Inicióa sesión para ver tu enlace" style="flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--glass-border); background: var(--bg-main); color: var(--text-main); font-size: 0.8rem;">
                <button class="btn-primary" id="copy-ref-btn" style="padding: 6px 10px; font-size: 0.8rem;"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </aside>

    
    <script type="module" src="js/friends-panel.js"></script>
</body>
</html>
