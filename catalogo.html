    <script>
    (function(){
        var tooltip = document.getElementById('gk-help-tooltip');
        var orb = document.getElementById('gk-help-orb');
        if (!tooltip || !orb) return;
        function showTooltip() { tooltip.classList.add('visible'); setTimeout(function(){ tooltip.classList.remove('visible'); }, 3200); }
        setTimeout(function(){ showTooltip(); setInterval(showTooltip, 18000); }, 4000);
        orb.addEventListener('mouseenter', function(){ tooltip.classList.add('visible'); });
        orb.addEventListener('mouseleave', function(){ tooltip.classList.remove('visible'); });
    })();
